name: Pages
# Publishes the static demo to GitHub Pages (chaseholroyd.com/charlie/) after CI passes on main.
# It does nothing while the repo is private: going public is Chase's call (PLAN M1.5).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays: refresh the demo's pinned sample market day (CHL-UX43).
    - cron: "30 13 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # CHL-PS17: a CI run only deploys if it was a push to this repo. A fork's pull request from a
    # branch named main also passes the branches filter above, so check the run's event and repo.
    # The weekly schedule deploys only on Chase's repo, never on a fork.
    if: >-
      (github.event.repository.private == false &&
        (github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository))) ||
      (github.event_name == 'schedule' && github.repository == 'holroydchase-afk/charlie')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Fetch Pyodide to self-host
        # npm checks the tarball against the registry's integrity hash.
        run: |
          npm pack pyodide@0.28.3 --silent
          mkdir pyodide-pkg && tar -xzf pyodide-0.28.3.tgz -C pyodide-pkg --strip-components=1
      - name: Build the demo
        run: python tools/build_demo.py site --pyodide-dir pyodide-pkg
      - name: Check the demo
        # No keys, and no hosts at all beyond the portfolio link: the runtime is served from this site.
        run: python tools/check_site.py site --no-cdn
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
